# All SpaceVim option below [option] section
[options]
  colorscheme = "base16-tomorrow-night"
  colorscheme_bg = "dark"
  enable_guicolors = true
  statusline_separator = "arrow"
  statusline_iseparator = "arrow"
  buffer_index_type = 4
  windows_index_type = 3
  enable_tabline_filetype_icon = true
  enable_statusline_mode = true
  statusline_unicode = true
  vimcompatible = true
  enable_vimfiler_welcome = false

# Layers
# Autocomplete
[[layers]]
  name = 'autocomplete'
  auto_completion_return_key_behavior = "complete"
  auto_completion_tab_key_behavior = "cycle"

# Shell
[[layers]]
  name = 'shell'
  default_position = 'bottom'
  default_height = 30

# Sudo
[[layers]]
  name = 'sudo'

# Fuzzy finder
[[layers]]
  name = 'denite'

# VCS
[[layers]]
  name = 'git'
[[layers]]
  name = 'VersionControl'

# Languages
[[layers]]
  name = 'lang#sh'
[[layers]]
  name = 'lang#typescript'
[[layers]]
  name = 'lang#javascript'
[[layers]]
  name = 'lang#ruby'
  enabled_linters = ['rubocop']
[[layers]]
  name = 'lang#python'
[[layers]]
  name = 'lang#php'
[[layers]]
  name = 'lang#toml'

# Custom plugins
# base16 colorscheme
[[custom_plugins]]
  repo = "base16-project/base16-vim"
  merged = false
