# Configuration for Alacritty, the GPU enhanced terminal emulator.

# Import additional configuration files
#
# Imports are loaded in order, skipping all missing files, with the importing
# file being loaded last. If a field is already present in a previous import, it
# will be replaced.
#
# All imports must either be absolute paths starting with `/`, or paths relative
# to the user's home directory starting with `~/`.
import = [
#  "~/.config/alacritty/tomorrow-night.toml",
  "~/.config/alacritty/mousebindings.toml",
  "~/.config/alacritty/keybindings.toml",
]

# Shell
#
# You can set `shell.program` to the path of your favorite shell, e.g.
# `/bin/fish`. Entries in `shell.args` are passed unmodified as arguments to the
# shell.
#
# Default:
#   - (Linux/BSD/macOS) `$SHELL` or the user's login shell, if `$SHELL` is unset
#   - (Windows) powershell
#[shell]
#program = "/bin/bash"
#args = ["-l"]

# Startup directory
#
# Directory the shell is started in. If this is unset, or "None", the working
# directory of the parent process will be used.
working_directory = "None"

# Live config reload (changes require restart)
live_config_reload = true

# Offer IPC using `alacritty msg` (unix only)
ipc_socket = true

# Any items in the `env` entry below will be added as
# environment variables. Some entries may override variables
# set by alacritty itself.
[env]
# TERM variable
#
# This value is used to set the `$TERM` environment variable for
# each instance of Alacritty. If it is not present, alacritty will
# check the local terminfo database and use `alacritty` if it is
# available, otherwise `xterm-256color` is used.
TERM = "xterm-256color"

[window]
# Spread additional padding evenly around the terminal content.
dynamic_padding = true

# Window decorations
#
# Values for `decorations`:
#     - full: Borders and title bar
#     - none: Neither borders nor title bar
#
# Values for `decorations` (macOS only):
#     - transparent: Title bar, transparent background and title bar buttons
#     - buttonless: Title bar, transparent background and no title bar buttons
decorations = "full"

# Background opacity
#
# Window opacity as a floating point number from `0.0` to `1.0`.
# The value `0.0` is completely transparent and `1.0` is opaque.
opacity = 0.8

# Request compositor to blur content behind transparent windows.
# (works on macOS/KDE Wayland)
#blur = false

# Startup Mode (changes require restart)
#
# Values for `startup_mode`:
#   - Windowed
#   - Maximized
#   - Fullscreen
#
# Values for `startup_mode` (macOS only):
#   - SimpleFullscreen
startup_mode = "Windowed"

# Window title
title = "Alacritty"

# Allow terminal applications to change Alacritty's window title.
dynamic_title = true

# Decorations theme variant
#
# Override the variant of the System theme/GTK theme/Wayland client side
# decorations. Commonly supported values are "Dark", "Light", and "None" for
# auto pick-up. Set this to "None" to use the default theme variant.
decorations_theme_variant = "None"

# Resize increments
#
# Prefer resizing window by discrete steps equal to cell dimensions.
#resize_increments = false

# Make `Option` key behave as `Alt` (macOS only):
#   - OnlyLeft
#   - OnlyRight
#   - Both
#   - None (default)
#option_as_alt = "None"

# Window dimensions (changes require restart)
#
# Number of lines/columns (not pixels) in the terminal. Both lines and columns
# must be non-zero for this to take effect. The number of columns must be at
# least `2`, while using a value of `0` for columns and lines will fall back
# to the window manager's recommended size
[window.dimensions]
columns = 108
lines = 30

# Window position (changes require restart)
#
# Specified in number of pixels.
# If the position is not set, the window manager will handle the placement.
#[window.position]
#x = 0
#y = 0

# Window padding (changes require restart)
#
# Blank space added around the window in pixels. This padding is scaled
# by DPI and the specified value is always added at both opposing sides.
[window.padding]
x = 4
y = 4

# Window class (Linux/BSD only)
#
# On Wayland, `general` is used as `app_id` and `instance` is ignored.
[window.class]
# Application instance name
instance = "Alacritty"
# General application class
general = "Alacritty"

[scrolling]
# Maximum number of lines in the scrollback buffer.
# Specifying '0' will disable scrolling. Limited to 100000.
history = 10000

# Scrolling distance multiplier.
#multiplier = 3

# Font configuration
[font]
# Font size in points.
size = 10.0

# Use built-in font for box drawing characters.
#
# If `true`, Alacritty will use a custom built-in font for box drawing
# characters (Unicode points 2500 - 259f) and powerline symbols
# (Unicode points U+E0B0 - U+E0B3).
#builtin_box_drawing: true

# Default:
#     Linux/BSD: { family = "monospace", style = "Regular" }
#     Windows: { family = "Consolas", style = "Regular" }
#     macOS: { family = "Menlo", style = "Regular" }
[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

# If the bold family is not specified, it will fall back to the
# value specified for the normal font.
[font.bold]
style = "Bold"

# If the italic family is not specified, it will fall back to the
# value specified for the normal font.
[font.italic]
style = "Italic"

# If the bold italic family is not specified, it will fall back to the
# value specified for the normal font.
[font.bold_italic]
style = "Bold Italic"

# Offset is the extra space around each character. `y` can be thought
# of as modifying the line spacing, and `x` as modifying the letter
# spacing.
[font.offset]
x = 1
y = 0

# Glyph offset determines the locations of the glyphs within their cells with
# the default being at the bottom. Increasing `x` moves the glyph to the
# right, increasing `y` moves the glyph upward.
[font.glyph_offset]
x = 0
y = 0

[colors]
# Indexed Colors
#
# The indexed colors include all colors from 16 to 256.
# When these are not set, they're filled with sensible defaults.
#
# Example:
#   [{ index = 16, color = "#ff00ff" },]
#
#indexed_colors = []

# Transparent cell backgrounds
#
# Whether or not `window.opacity` applies to all cell backgrounds or only to
# the default background. When set to `true` all cells will be transparent
# regardless of their background color.
#transparent_background_colors = false

# If `true`, bold text is drawn using the bright color variants.
draw_bold_text_with_bright_colors = false

#[colors.primary]
#foreground = "#d8d8d8"
#background = "#181818"

# Bright and dim foreground colors
#
# The dimmed foreground color is calculated automatically if it is not
# present. If the bright foreground color is not set, or
# `draw_bold_text_with_bright_colors` is `false`, the normal foreground
# color will be used.
#dim_foreground = "#828482"
#bright_foreground = "None"

# Cursor colors
#
# Colors which should be used to draw the terminal cursor.
#
# Allowed values are CellForeground/CellBackground, which reference the
# affected cell, or hexadecimal colors like #ff00ff.
#[colors.cursor]
#text = "CellBackground"
#cursor = "CellForeground"

# Vi mode cursor colors
#
# Colors for the cursor when the vi mode is active.
#
# Allowed values are CellForeground/CellBackground, which reference the
# affected cell, or hexadecimal colors like #ff00ff.
#[colors.vi_mode_cursor]
#text = "CellBackground"
#cursor = "CellForeground"

# Search colors
#
# Colors used for the search bar and match highlighting.
#
# Allowed values are CellForeground/CellBackground, which reference the
# affected cell, or hexadecimal colors like #ff00ff.
#[colors.search.matches]
#foreground: "#181818"
#background: "#ac4242"
#[colors.search.focused_match]
#foreground: "#181818"
#background: "#f4bf75"

# Keyboard regex hints
#
# First character in the hint label
#
# Allowed values are CellForeground/CellBackground, which reference the
# affected cell, or hexadecimal colors like #ff00ff.
#[colors.hints.start]
#foreground: "#181818"
#background: "#f4bf75"

# All characters after the first one in the hint label
#
# Allowed values are CellForeground/CellBackground, which reference the
# affected cell, or hexadecimal colors like #ff00ff.
#[colors.hints.end]
#foreground: "#181818"
#background: "#ac4242"

# Line indicator
#
# Color used for the indicator displaying the position in history during
# search and vi mode.
#
# Setting this to "None" will use the opposing primary color.
#[colors.line_indicator]
#foreground: "None"
#background: "None"

# Footer bar
#
# Color used for the footer bar on the bottom, used by search regex input,
# hyperlink URI preview, etc.
#[colors.footer_bar]
#foreground: "#181818"
#background: "#d8d8d8"

# Selection colors
#
# Colors which should be used to draw the selection area.
#
# Allowed values are CellForeground/CellBackground, which reference the
# affected cell, or hexadecimal colors like #ff00ff.
#[colors.selection]
#text = "CellBackground"
#background = "CellForeground"

# Normal colors
#[colors.normal]
#black = "#181818"
#red = "#ac4242"
#green = "#90a959"
#yellow = "#f4bf75"
#blue = "#6a9fb5"
#magenta = "#aa759f"
#cyan = "#75b5aa"
#white = "#d8d8d8"

# Bright colors
#[colors.bright]
#black = "#6b6b6b"
#red = "#c55555"
#green = "#aac474"
#yellow = "#feca88"
#blue = "#82b8c8"
#magenta = "#c28cb8"
#cyan = "#93d3c3"
#white = "#f8f8f8"

# Dim colors
#
# If the dim colors are not set, they will be calculated automatically based
# on the `normal` colors.
#[colors.dim]
#black = "#0f0f0f"
#red = "#712b2b"
#green = "#5f6f3a"
#yellow = "#a17e4d"
#blue = "#456877"
#magenta = "#704d68"
#cyan = "#4d7770"
#white = "#8e8e8e"

# Bell
#
# The bell is rung every time the BEL control character is received.
[bell]
# Visual Bell Animation
#
# Animation effect for flashing the screen when the visual bell is rung.
#
# Values for `animation`:
#   - Ease
#   - EaseOut
#   - EaseOutSine
#   - EaseOutQuad
#   - EaseOutCubic
#   - EaseOutQuart
#   - EaseOutQuint
#   - EaseOutExpo
#   - EaseOutCirc
#   - Linear
#animation = EaseOutExpo

# Duration of the visual bell flash in milliseconds. A `duration` of `0` will
# disable the visual bell animation.
duration = 1

# Visual bell animation color.
#color = "#ffffff"

# Bell Command
#
# This program is executed whenever the bell is rung.
#
# When set to "None", no command will be executed.
#
# Example:
#   { program = "notify-send", args = ["Hello, World!",] }
#
#command = "None"

[selection]
# This string contains all characters that are used as separators for
# "semantic words" in Alacritty.
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

# When set to `true`, selected text will be copied to the primary clipboard.
save_to_clipboard = true

[cursor]
# Vi mode cursor style
#
# If the vi mode cursor style is "None" or not specified, it will fall back to
# the style of the active value of the normal cursor.
#vi_mode_style = "None"

# Cursor blinking interval in milliseconds.
#blink_interval = 750

# Time after which cursor stops blinking, in seconds.
#
# Specifying '0' will disable timeout for blinking.
#blink_timeout = 5

# If this is `true`, the cursor will be rendered as a hollow box when the
# window is not focused.
#unfocused_hollow = true

# Thickness of the cursor relative to the cell width as floating point number
# from `0.0` to `1.0`.
#thickness = 0.15

# Cursor style
[cursor.style]
# Cursor shape
#
# Values for `shape`:
#   - ▇ Block
#   - _ Underline
#   - | Beam
shape = "Block"

# Cursor blinking state
#
# Values for `blinking`:
#   - Never: Prevent the cursor from ever blinking
#   - Off: Disable blinking by default
#   - On: Enable blinking by default
#   - Always: Force the cursor to always blink
blinking = "On"

#[terminal]
# Controls the ability to write to the system clipboard with the OSC 52
# escape sequence. While this escape sequence is useful to copy contents
# from the remote server, allowing any application to read from the clipboard
# can be easily abused while not providing significant benefits over
# explicitly pasting text.
#osc52 = "OnlyCopy"

[mouse]
# If this is `true`, the cursor is temporarily hidden when typing.
hide_when_typing = false

# Regex hints
#
# Terminal hints can be used to find text in the visible part of the terminal
# and pipe it to other applications.
[hints]
# Keys used for the hint labels.
alphabet = "jfkdls;ahgurieowpq"

# List with all available hints
#
# Each hint must have any of `regex` or `hyperlinks` field and either an
# `action` or a `command` field. The fields `mouse`, `binding` and
# `post_processing` are optional.
#
# The `hyperlinks` option will cause OSC 8 escape sequence hyperlinks to be
# highlighted.
#
# The fields `command`, `binding.key`, `binding.mods`, `binding.mode` and
# `mouse.mods` accept the same values as they do in the `key_bindings` section.
#
# The `mouse.enabled` field controls if the hint should be underlined while
# the mouse with all `mouse.mods` keys held or the vi mode cursor is above it.
#
# If the `post_processing` field is set to `true`, heuristics will be used to
# shorten the match if there are characters likely not to be part of the hint
# (e.g. a trailing `.`). This is most useful for URIs and applies only to
# `regex` matches.
#
# Values for `action`:
#   - Copy
#       Copy the hint's text to the clipboard.
#   - Paste
#       Paste the hint's text to the terminal or search.
#   - Select
#       Select the hint's text.
#   - MoveViModeCursor
#       Move the vi mode cursor to the beginning of the hint.
#[[hints.enabled]]
#command = "xdg-open" # On Linux/BSD
#command = "open" # On macOS
#command = { program = "cmd", args = [ "/c", "start", "" ] } # On Windows
#hyperlinks = true
#post_processing = true
#persist = false
#mouse.enabled = true
#binding = { key = "U", mods = "Control|Shift" }
#regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"

#[debug]
# Display the time it takes to redraw each frame.
#render_timer = false

# Keep the log file after quitting Alacritty.
#persistent_logging = false

# Log level
#
# Values for `log_level`:
#   - Off
#   - Error
#   - Warn
#   - Info
#   - Debug
#   - Trace
#log_level = "Warn"

# Renderer override.
#   - glsl3
#   - gles2
#   - gles2_pure
#renderer = "None"

# Print all received window events.
#print_events = false

# Highlight window damage information.
#highlight_damage = false

# Use EGL as display API if the current platform allows it.
# Note that transparency may not work with EGL on Linux/BSD.
#prefer_egl = false
