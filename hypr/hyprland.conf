#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=HDMI-A-1,3840x2160@60,auto,1.25


# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = hyprpaper
exec-once = waybar
exec-once = dunst
exec-once = ibus-daemon -drxR
# exec-once = /usr/lib/ibus/ibus-ui-gtk3 --enable-wayland-im --exec-daemon --daemon-args "--xim --panel disable"
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = udiskie &
exec-once = pcmanfm-qt -d &

exec-once = /usr/lib/protonmail/bridge/proton-bridge --no-window --software-renderer
exec-once = flatpak run --command=telegram-desktop org.telegram.desktop -autostart
exec-once = /home/cookie/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox --minimize

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Hyprcursor variables
#env = HYPRCURSOR_THEME,MyCursor
env = HYPRCURSOR_SIZE,24
env = XCURSOR_SIZE,24

# XDG specifications.
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# IM variables.
env = GTK_IM_MODULE,ibus
env = QT_IM_MODULE,ibus
env = XMODIFIERS,@im=ibus

# GTK variables.
env = GDK_BACKEND,wayland,x11
env = GDK_SCALE,1
env = GDK_DPI_SCALE,1

# Qt variables.
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_ENABLE_HIGHDPI_SCALING,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct

# Electron variables.
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# Env for Nvidia.
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,kr,jp
    kb_variant = ,kr104,kana
    kb_model =
    kb_options = korean:ralt_hangul,korean:rctrl_hanja,japan:kana_lock
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    sensitivity = 1.0

    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = 0x665ce626
    col.inactive_border = 0x66333333

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }

    drop_shadow = true
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_is_master = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = false
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0
}

# unscale XWayland
xwayland {
    force_zero_scaling = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
#device {
#    name = epic-mouse-v1
#    sensitivity = -0.5
#}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

windowrule = float, ^(.*)$
windowrule = tile, ^(Alacritty)(.*)$
windowrule = tile, ^(kitty)(.*)$
windowrulev2 = tile, class:(pcmanfm-qt)$
windowrulev2 = tile, class:(firefox)$,title:(Firefox)
#windowrulev2 = tile, class:(Thunderbird)$
windowrulev2 = tile, class:^(Brave-browser)$,title:(Brave)$

windowrulev2 = tile, class:(zathura)
windowrulev2 = tile, class:(imv)
windowrulev2 = tile, class:(mpv)

windowrule = move cursor 10 10, ^(waybar)$
windowrule = move onscreen 100%-360 44, ^(jetbrains-toolbox)$

windowrulev2 = size 1920 1200, class:(Thunderbird)$
windowrulev2 = center 1, class:(Thunderbird)$

windowrule = nofocus, ^(Ibus-ui-gtk3)$

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, alacritty
bind = $mainMod, E, exec, pcmanfm-qt
bind = $mainMod, B, exec, flatpak run org.mozilla.firefox
bind = $mainMod, Q, killactive,
bind = CTRL_SHIFT, escape, exit,
bind = $mainMod, T, togglefloating,
bind = $mainMod, F, fullscreen,
bind = ALT, SPACE, exec, pkill wofi || wofi --show drun
bind = CTRL_ALT, B, exec, pkill waybar || waybar

# dwindle
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# to switch between windows in a floating workspace
bind = $mainMod,Tab,cyclenext, # change focus to another window
bind = $mainMod,Tab,bringactivetotop, # bring it to the top

# Window movement bind
bind = $mainMod, C, centerwindow, 1
bind = $mainMod_SHIFT, C, centerwindow,
bind = $mainMod_SHIFT, P, pin,

bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod, SPACE, exec, echo -e 'en\nko\nja' | wofi --dmenu | bash -c ~/.config/hypr/scripts/ibus.sh
bind = $mainMod, l, exec, hyprlock
bind = ALT_SHIFT, 3, exec, bash -c ~/.config/hypr/scripts/screenshot.sh
bind = CTRL_ALT_SHIFT, 3, exec, bash -c ~/.config/hypr/scripts/screenclip.sh
bind = ALT_SHIFT, 4, exec, bash -c ~/.config/hypr/scripts/areashot.sh
bind = CTRL_ALT_SHIFT, 4, exec, bash -c ~/.config/hypr/scripts/areaclip.sh

# Media key binds
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod_SHIFT, left, movewindow, l
bind = $mainMod_SHIFT, right, movewindow, r
bind = $mainMod_SHIFT, up, movewindow, u
bind = $mainMod_SHIFT, down, movewindow, d

bind = $mainMod_CTRL, left, resizeactive, -50 0
bind = $mainMod_CTRL, right, resizeactive, 50 0
bind = $mainMod_CTRL, up, resizeactive, 0 -50
bind = $mainMod_CTRL, down, resizeactive, 0 50

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
