# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, uwsm app -- alacritty
bind = $mainMod, E, exec, uwsm app -- pcmanfm-qt
bind = $mainMod, Q, killactive,
bind = $mainMod, T, togglefloating,
bind = $mainMod, F, fullscreen,
bind = ALT, SPACE, exec, pkill wofi || uwsm app -- $(wofi --show drun --define=drun-print_desktop_file=true)
bind = CTRL_SHIFT, escape, exec, uwsm stop

# dwindle
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# to switch between windows in a floating workspace
bind = $mainMod,Tab,cyclenext, # change focus to another window
bind = $mainMod,Tab,bringactivetotop, # bring it to the top

# Window movement bind
bind = $mainMod, C, centerwindow, 1
bind = $mainMod_SHIFT, C, centerwindow,
bind = $mainMod_SHIFT, P, pin,

bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod, l, exec, hyprlock
bind = $mainMod, W, exec, bash -c ~/.config/hypr/scripts/paper.sh
bind = ALT_SHIFT, 3, exec, bash -c ~/.config/hypr/scripts/screenshot.sh
bind = CTRL_ALT_SHIFT, 3, exec, bash -c ~/.config/hypr/scripts/screenclip.sh
bind = ALT_SHIFT, 4, exec, bash -c ~/.config/hypr/scripts/areashot.sh
bind = CTRL_ALT_SHIFT, 4, exec, bash -c ~/.config/hypr/scripts/areaclip.sh

# Media key binds
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod_SHIFT, left, movewindow, l
bind = $mainMod_SHIFT, right, movewindow, r
bind = $mainMod_SHIFT, up, movewindow, u
bind = $mainMod_SHIFT, down, movewindow, d

bind = $mainMod_ALT, left, resizeactive, -50 0
bind = $mainMod_ALT, right, resizeactive, 50 0
bind = $mainMod_ALT, up, resizeactive, 0 -50
bind = $mainMod_ALT, down, resizeactive, 0 50

bind = $mainMod_CTRL, left, workspace, e-1
bind = $mainMod_CTRL, right, workspace, e+1

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
