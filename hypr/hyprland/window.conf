# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrule = suppressevent maximize, class:.* # You'll probably like this.

windowrule = float, class:^(.*)$
windowrule = tile, class:^(Alacritty)(.*)$
windowrule = tile, class:(pcmanfm-qt)$
windowrule = tile, class:(zathura)
windowrule = tile, class:(imv)
windowrule = tile, class:(mpv)
windowrule = tile, class:^(zen)(.*)$
windowrule = tile, class:^(brave-browser)$
windowrule = tile, class:^(org.mozilla.Thunderbird)$
windowrule = tile, class:^(codium)$
windowrule = tile, class:^(dev.zed.Zed)$
windowrule = tile, class:(VirtualBox Machine)$

windowrule = move cursor 10 10, class:^(waybar)$
windowrule = move onscreen 100%-380 44, class:^(jetbrains-toolbox)$

windowrule = size 680 600, class:^(org.telegram.desktop)$
windowrule = move onscreen 60% 20%, class:^(org.telegram.desktop)$
windowrule = size 1180 700, class:^(com.discordapp.Discord)$
windowrule = center 1, class:^(com.discordapp.Discord)$
windowrule = size 1200 780, class:(Spotify)$
windowrule = center 1, class:(Spotify)$
windowrule = size 1200 780, class:(VirtualBox Manager)$
windowrule = center 1, class:(VirtualBox Manager)$
